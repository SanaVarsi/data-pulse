name: Daily Weather Pipeline
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync
      - name: Run weather pipeline
        run: uv run python pipelines/weather/weather_pipeline.py
      - name: Run dbt models
        run: cd transforms && uv run dbt run --profiles-dir .

      - name: Commit updated database
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add bright_sky_weather.duckdb
          git commit -m "chore: update weather data" || echo "No changes to commit"
          git push
