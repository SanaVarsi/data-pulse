name: Daily Weather Pipeline
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        # --frozen: use uv.lock exactly as committed, never re-resolve/rewrite it.
        # Without this, `uv sync` silently rewrites uv.lock in CI (the runner has
        # no exclude-newer policy, unlike a dev machine with one configured
        # globally), leaving a tracked file dirty that later breaks the
        # git-commit step below with "cannot pull with rebase: unstaged changes".
        run: uv sync --frozen
      - name: Run weather pipeline
        run: uv run python pipelines/weather/weather_pipeline.py
      - name: Run dbt models
        run: cd transforms && uv run dbt run --profiles-dir .

      - name: Commit updated database
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # -A, not just the duckdb file: catches any other tracked file a
          # pipeline/dbt run might touch, so it can't be left dirty and block
          # the rebase below.
          git add -A
          git commit -m "chore: update weather data" || echo "No changes to commit"
          git pull --rebase origin main
          git push

